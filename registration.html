<!DOCTYPE html>
<html lang="en">

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="login" class="maincon">

        <div class="loghead">
            <h1>Register Account</h1>
        </div>


        <div class="txtb">

            <form>

                <label>Username</label>

                <input type="text"
                name="text"
                id="itxtbox"
                class="ctxtbox"
                placeholder="Username">
              
                <label>Email</label>

                <input type="text"
                name="text"
                id="itxtbox"
                class="ctxtbox"
                placeholder="Username">

                <label>Password</label>

                <input type="password"
                name="password"
                id="ipassbox"
                class="cpassbox"
                placeholder="Password">
                

                <button type="submit">Register</button>

            </form>

        </div>

        <div class="new">
            <p>
                Already signed in??
                <a href="index.html">Sign up now.</a>
            </p>

        </div>


</body>
