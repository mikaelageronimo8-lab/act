<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" id="submitBtn">Login</button>
    </form>

    <!-- Dito lalabas ang Status Message -->
    <div id="statusMessage" class="status-msg"></div>

    <p class="footer-text">Don't have an account? <a href="registration.html">Register here</a></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const statusMsg = document.getElementById('statusMessage');
      const submitBtn = document.getElementById('submitBtn');

      statusMsg.className = 'status-msg info';
      statusMsg.innerText = 'Logging in...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.text();

        if (response.ok) {
          statusMsg.className = 'status-msg success';
          statusMsg.innerText = 'Login successful! Welcome back.';
        } else {
          statusMsg.className = 'status-msg error';
          statusMsg.innerText = result || 'Invalid username or password.';
        }
      } catch (err) {
        statusMsg.className = 'status-msg error';
        statusMsg.innerText = 'Connection error. Please try again.';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
