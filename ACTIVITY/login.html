<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="login" class="maincon">
    
        <div class="loghead">
            <h1>Login Account</h1>
        </div>

        <div class="txtb">

            <form>

                <label>Username</label>

                <input type="text"
                name="text"
                id="itxtbox"
                class="ctxtbox"
                placeholder="Username">

                <label>Password</label>

                <input type="password"
                name="password"
                id="ipassbox"
                class="cpassbox"
                placeholder="Password">

                <button type="submit">Login</button>

            </form>

        </div>


        <div class="new">

            <p>
                <a href="resetpass">Forgot password?</a>
            </p>

            <p>
                Don't have an account?
                <a href="registration.html">Register now.</a>
            </p>

        </div>

</body>

</html>
